# Log configuration for the PC simulator.
#
# Kconfig .conf syntax, and the symbol names are exactly those in Kconfig.fw --
# so this file and a firmware defconfig fragment are interchangeable, and a
# config can be compared between sim and target by diffing them.
#
# conf_to_autoconf.py turns this into output/log_autoconf.h the same way the
# firmware build turns its .conf files into autoconf.h.

CONFIG_N_LOG=y

# --- Mode: exactly one (the converter rejects zero or several) --------------
# CONFIG_N_LOG_MODE_STRING is not set
CONFIG_N_LOG_MODE_ENCODE=y
# CONFIG_N_LOG_MODE_DISABLE is not set

# --- Backends ---------------------------------------------------------------
CONFIG_N_LOG_BACKEND_UART=y
CONFIG_N_LOG_BACKEND_RAM=y
CONFIG_N_LOG_BACKEND_EXT_MEM=y

# --- Level thresholds -------------------------------------------------------
# Entries above this are compiled out entirely.
CONFIG_N_LOG_COMPILE_THRESHOLD_DBG=y
# RAM keeps every level; only these are copied on to external storage.
CONFIG_N_LOG_EXT_LEVEL_THRESHOLD_WRN=y

# --- External storage -------------------------------------------------------
CONFIG_N_LOG_EXT_FULL_FREEZE=y
# CONFIG_N_LOG_EXT_FULL_ERASE is not set
CONFIG_N_LOG_EXT_FLUSH_MARKER=y

# --- Tuning -----------------------------------------------------------------
CONFIG_N_LOG_RAM_FLUSH_THRESHOLD=480
CONFIG_N_LOG_EXT_FLUSH_STAGE_SIZE=256
CONFIG_N_LOG_WRITE_TIMEOUT_MS=6
CONFIG_N_LOG_FLUSH_TIMEOUT_MS=10000
CONFIG_N_LOG_FLUSH_TASK_STACK_SIZE=256
CONFIG_N_LOG_FLUSH_TASK_PRIORITY=1
