# Log configuration for the PC simulator.
#
# Kconfig .conf syntax, and the symbol names are the ones the firmware Kconfig
# uses -- so this file and a firmware defconfig fragment are interchangeable, and
# a config can be compared between sim and target by diffing them. This file is
# also the authoritative list of the symbols the log module understands.
#
# conf_to_autoconf.py turns this into output/log_autoconf.h the same way the
# firmware build turns its .conf files into autoconf.h.

CONFIG_N_LOG=y

# --- Mode: string=1, encode=2, disable=3 ------------------------------------
CONFIG_N_LOG_MODE=2

# --- Backends ---------------------------------------------------------------
CONFIG_N_LOG_BACKEND_UART=y
CONFIG_N_LOG_BACKEND_RAM=y
CONFIG_N_LOG_BACKEND_EXT_MEM=y

# --- Level thresholds -------------------------------------------------------
# error=0, warning=1, info=2, debug=3
CONFIG_N_LOG_COMPILE_THRESHOLD=3
# Initial global runtime filter; it can still be changed by the control API.
CONFIG_N_LOG_RUNTIME_THRESHOLD=3
# RAM keeps every runtime-approved level; ext storage keeps <= this value.
CONFIG_N_LOG_EXT_LEVEL_THRESHOLD=1

# --- External storage -------------------------------------------------------
# freeze=1, erase-and-restart=2
CONFIG_N_LOG_EXT_FULL=1
CONFIG_N_LOG_EXT_FLUSH_MARKER=y

# --- Tuning -----------------------------------------------------------------
CONFIG_N_LOG_FLUSH_TIMEOUT_MS=10000
